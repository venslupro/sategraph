# Scheduler worker: orbit polling, 48h graph publication and weekly backups.
# D1 and KV are provisioned by terraform/ (single production environment);
# paste the `terraform output` values into the two identifiers below.
name = "sategraph-scheduler"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "SATEGRAPH_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID" # terraform output kv_namespace_id

[[d1_databases]]
binding = "SATEGRAPH_DB"
database_name = "sategraph"
database_id = "REPLACE_WITH_D1_DATABASE_ID" # terraform output d1_database_id

[ai]
binding = "AI"

[[workflows]]
name = "graph-refresh"
binding = "GRAPH_REFRESH_WORKFLOW"
class_name = "GraphRefreshWorkflow"

[[workflows]]
name = "backup"
binding = "BACKUP_WORKFLOW"
class_name = "BackupWorkflow"

[triggers]
crons = [
  "0 */2 * * *",
  "0 3 */2 * *",
  "0 4 * * 1"
]

[vars]
GRAPH_BACKEND = "neo4j"
AGENT_MODE = "workers-ai"

# Optional secrets (set with `wrangler secret put`):
# NEO4J_HTTP_URL, NEO4J_DATABASE, NEO4J_USER, NEO4J_PASSWORD
# B2_ENDPOINT, B2_BUCKET, B2_KEY_ID, B2_APP_KEY, B2_REGION
# ADMIN_TOKEN
