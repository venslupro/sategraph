name: terraform

# Provisions every Cloudflare resource except the scheduler Worker and the
# Pages project (those are deployed by the cd pipeline with wrangler).
#
# Plan runs everywhere (any branch, any PR, no environment). Apply only runs
# on the main branch in the production environment; pushes or dispatches from
# any other branch skip the apply job entirely.
#
# Required repository configuration:
#   secrets.CLOUDFLARE_API_TOKEN       token allowed to edit D1 + KV
#   secrets.CLOUDFLARE_ACCOUNT_ID      Cloudflare account ID
#   secrets.B2_STATE_KEY_ID            B2 application key ID for the state bucket
#   secrets.B2_STATE_APP_KEY           B2 application key for the state bucket
#
# The state backend (bucket, endpoint, region) is pinned in
# terraform/main.tf; GitHub only supplies the credentials.

on:
  push:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        type: choice
        options: [apply, plan]
        default: apply

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  plan:
    # Any branch, any PR: read-only plan, no environment.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_STATE_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_STATE_APP_KEY }}
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Init
        run: terraform init

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan \
            -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

  apply:
    # Only the main branch may touch the production environment.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_STATE_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_STATE_APP_KEY }}
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Init
        run: terraform init

      - name: Apply
        run: |
          terraform apply -auto-approve \
            -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Terraform (production)"
            terraform output -no-color || true
          } >> "$GITHUB_STEP_SUMMARY"
