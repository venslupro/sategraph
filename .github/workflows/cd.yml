name: cd

# Deploys to the single production environment after CI succeeds on main.
# Infrastructure (D1, KV) is provisioned separately with terraform/.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy scheduler worker
        run: npm run deploy:scheduler

      - name: Deploy Pages site
        run: npx wrangler pages deploy apps/web/dist --project-name satgraph --branch main
